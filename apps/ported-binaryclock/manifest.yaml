gdn: 1
id: ported-binaryclock
version: 0.2.0
name: Binary Clock
author: tidbyt-community
description: The tidbyt/community "Binary Clock" app, ported to GDN — translated then hand-finished.
category: Time
entry: app.star
# tronbyt/Pixlet native size.
width: 64
height: 32
refresh: 60
pages: [main]
inputs:
  # schema.Location -> a US time zone (GDN's ctx.now is UTC). Daylight saving is
  # applied automatically, so this never needs changing twice a year.
  - key: zone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "ARIZONA", "PACIFIC", "ALASKA", "HAWAII"]
  - key: oncolor
    type: string
    app_input_type: color
    label: Active bit color
    default: "#FF0000"
  - key: showseconds
    type: choice
    app_input_type: dropdown
    label: Seconds column
    default: "no"
    choices: ["no", "yes"]
    help: The panel redraws once a minute, so the seconds column is a frozen snapshot. Off gives five wider columns.