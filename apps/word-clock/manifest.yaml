gdn: 1
id: word-clock
version: 0.1.0
name: Word Clock
author: glance-led-dev
description: A QLOCKTWO in landscape — the time spelled out in a field of letters, with four dots carrying the odd minutes. No network.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [clock]

inputs:
  - key: nightstart
    type: string
    app_input_type: free-text
    label: Night starts (hour)
    default: "22"
    help: Hour, 0-23. After this the letter field goes dark and only the sentence stays lit.
  - key: nightend
    type: string
    app_input_type: free-text
    label: Night ends (hour)
    default: "7"
    help: Hour, 0-23.
