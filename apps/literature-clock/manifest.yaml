gdn: 1
id: literature-clock
version: 0.2.0
name: Literature Clock
author: glance-led-dev
description: The current minute as a passage from a novel that names that exact time, with the clock glowing inside the prose. No API key.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [book]

inputs:
  - key: zone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["PACIFIC", "ARIZONA", "MOUNTAIN", "CENTRAL", "EASTERN"]
    help: Daylight saving is applied automatically.
