gdn: 1
id: local-closings
version: 0.1.0
name: Local Closings
author: John McRae
description: "Paste a local TV Closings and Delays page to see reported school and business closings. Optional school name pins a listed match to page one. No API key."
category: Weather
entry: app.star
width: 192
height: 32
# Closings change on a human timescale. Five minutes is enough.
refresh: 300
pages: [board, one, two, three, four, five]
inputs:
  - key: school
    type: string
    app_input_type: free-text
    label: School Name
    default: ""
    help: "Optional. Type your school or organization name. If the station listed it, that closing is shown first. The app cannot add a school that is not on the page."
  - key: closingsurl
    type: string
    app_input_type: free-text
    label: Closings Website URL
    default: "www.21alivenews.com/weather/closings/"
    help: "Paste the station Closings and Delays page URL. https is added if omitted. If you see SOURCE NOT SUPPORTED, try another local station that lists closings for your school."
