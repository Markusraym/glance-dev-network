gdn: 1
id: ported-bigclock
version: 0.2.0
name: Big Clock
author: tidbyt-community
description: The tidbyt/community "Big Clock" app, ported to GDN — translated then hand-finished. Color fades through the day like the original's sunrise tint.
category: Time
entry: app.star
# tronbyt/Pixlet native size.
width: 64
height: 32
refresh: 60
pages: [main]
inputs:
  # schema.Location -> a US time zone (GDN's ctx.now is UTC). Daylight saving is
  # applied automatically, so this never needs changing twice a year.
  - key: zone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "ARIZONA", "PACIFIC", "ALASKA", "HAWAII"]
  - key: hourformat
    type: choice
    app_input_type: dropdown
    label: Hour format
    default: "24"
    choices: ["24", "12"]
  - key: leadingzero
    type: choice
    app_input_type: dropdown
    label: Leading zero
    default: "no"
    choices: ["no", "yes"]