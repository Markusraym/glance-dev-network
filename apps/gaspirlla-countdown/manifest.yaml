gdn: 1
id: gasparilla-countdown
version: 0.1.0
name: Gasparilla Countdown
author: Sylus - GLANCE
description: Counts down the days until the Gasparilla pirate festival, with a pirate flag.
category: Lifestyle
entry: app.star
width: 192
height: 32
refresh: 3600
pages: [countdown]
inputs:
  - key: eventdate
    type: string
    app_input_type: date
    label: Festival date
    default: "2027-01-30"
  - key: label
    type: string
    app_input_type: free-text
    label: Header text
    default: GASPARILLA
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#FFC300"
assets:
  - PIRATE_FLAG.png