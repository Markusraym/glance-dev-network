name: "Disney World Parks (Scroll)"
author: "Olskoolgamer"
description: The scroll companion to drb116's Disney World Parks - one page per Orlando park with its pixel wordmark and landmark art (the castle, Spaceship Earth, the Tower of Terror, the Tree of Life), the crowd meter, and what the extra width is for - the four longest standby waits in the park right now, color-banded by pain. After hours it shows today's and tomorrow's park hours instead.
