gdn: 1
id: google-reviews
version: 0.2.0
name: "Google Reviews"
author: "Olskoolgamer"
description: Your business's Google rating, live on the wall - the score as a hero number, five stars filled to the exact rating (half stars included), the review count, and your business name under the pixel Google G. No API key, no setup - type your business name and city and it finds your listing.
category: Productivity
entry: app.star

width: 192
height: 32

# Google recomputes the public rating slowly; 30 min matches the fetch ttls.
refresh: 1800

pages: [rating]

inputs:
  - key: business
    type: string
    app_input_type: free-text
    label: Business
    default: "Le Tub Saloon Hollywood FL"
    help: Your business name plus city and state, like the example. The app finds the matching Google listing - check the name it shows is yours. A Place ID (ChIJ...) also works for tricky matches.
