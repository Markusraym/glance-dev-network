gdn: 1
id: glucose-monitor
name: Glucose Monitor
description: Live CGM Dexcom glucose reading, trend arrow, and rolling average from Nightscout that uses international consensus guidelines.
author: jkapera
width: 128
height: 32
refresh: 300
pages: [main]
inputs:
  - key: nightscouturl
    type: string
    app_input_type: free-text
    label: Nightscout URL
    default: "yoursite.onrender.com"
    help: "Your Nightscout site domain, no https:// (e.g. yoursite.onrender.com)"
  - key: token
    required: true
    type: string
    app_input_type: api-key
    label: Nightscout Access Token
    help: "A read-only access token from your Nightscout Admin Tools"
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/Denver"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
      - "America/Mexico_City"
      - "America/New_York"
      - "America/Bogota"
