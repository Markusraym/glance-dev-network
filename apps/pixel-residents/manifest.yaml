gdn: 1
id: pixel-residents
version: 0.1.0
name: Pixel Residents
author: John McRae
description: An original pixel resident follows a tiny daily routine inside a wall-mounted apartment.
category: Lifestyle
entry: app.star
width: 192
height: 32
refresh: 60
pages: [home]

inputs:
  - key: charactername
    type: string
    app_input_type: free-text
    label: Character name
    default: PIXEL

  - key: personality
    type: choice
    app_input_type: dropdown
    label: Personality
    default: COZY
    choices: [COZY, BUSY, LAZY, GAMER, BOOKWORM, RANDOM]

  - key: shirtcolor
    type: string
    app_input_type: color
    label: Shirt color
    default: "#00DC46"

  - key: haircolor
    type: string
    app_input_type: color
    label: Hair color
    default: "#8B5A2B"

  - key: skintone
    type: choice
    app_input_type: dropdown
    label: Skin tone
    default: MEDIUM
    choices: [LIGHT, MEDIUM, TAN, DARK]

  - key: roomtheme
    type: choice
    app_input_type: dropdown
    label: Room theme
    default: COZY
    choices: [COZY, MODERN, ARCADE, CABIN, NIGHT]

  - key: petenabled
    type: string
    app_input_type: checkbox
    label: Enable pet
    default: "true"

  - key: pettype
    type: choice
    app_input_type: dropdown
    label: Pet type
    default: CAT
    choices: [CAT, DOG]

  - key: showclock
    type: string
    app_input_type: checkbox
    label: Display clock
    default: "true"

  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
      - "America/Mexico_City"
      - "America/New_York"
      - "America/Bogota"
      - "America/Halifax"
      - "America/Sao_Paulo"
      - "America/Argentina/Buenos_Aires"
      - "UTC"
      - "Europe/Lisbon"
      - "Europe/Dublin"
      - "Europe/London"
      - "Europe/Madrid"
      - "Europe/Paris"
      - "Europe/Amsterdam"
      - "Europe/Berlin"
      - "Europe/Rome"
      - "Europe/Stockholm"
      - "Europe/Warsaw"
      - "Africa/Lagos"
      - "Europe/Athens"
      - "Europe/Helsinki"
      - "Africa/Johannesburg"
      - "Europe/Moscow"
      - "Africa/Nairobi"
      - "Asia/Dubai"
      - "Asia/Karachi"
      - "Asia/Kolkata"
      - "Asia/Dhaka"
      - "Asia/Bangkok"
      - "Asia/Jakarta"
      - "Asia/Shanghai"
      - "Asia/Singapore"
      - "Asia/Hong_Kong"
      - "Australia/Perth"
      - "Asia/Tokyo"
      - "Asia/Seoul"
      - "Australia/Adelaide"
      - "Australia/Brisbane"
      - "Australia/Sydney"
      - "Australia/Melbourne"
      - "Pacific/Auckland"
      - "Atlantic/Reykjavik"
      - "Europe/Kyiv"
      - "Europe/Istanbul"
      - "Africa/Cairo"
      - "Asia/Jerusalem"
      - "Asia/Manila"
  - key: lights
    type: choice
    app_input_type: dropdown
    label: Room lights
    default: AUTO
    choices: [AUTO, "ON", "OFF"]

  - key: pcpower
    type: choice
    app_input_type: dropdown
    label: PC power
    default: AUTO
    choices: [AUTO, "ON", "OFF"]

  - key: message
    type: string
    app_input_type: free-text
    label: Message override
    help: Optional custom message. Leave blank for the resident's activity messages.
    default: ""

  - key: schedule
    type: choice
    app_input_type: dropdown
    label: Schedule
    default: NORMAL
    choices: [NORMAL, EARLY BIRD, NIGHT OWL]

  - key: previewmode
    type: choice
    app_input_type: dropdown
    label: Resident action
    help: Choose AUTO ROUTINE to resume the normal local-time schedule.
    default: AUTO ROUTINE
    choices: ["AUTO ROUTINE", WAVE, DANCE, "MAKE COFFEE", "PLAY GAME", "READ BOOK", "WATER PLANT", "CALL PET", "FEED PET", "PLAY WITH PET", "PET NAP", "GO TO BED"]
