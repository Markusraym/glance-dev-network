gdn: 1
id: ported-analogclock
version: 0.2.0
name: Analog Clock
author: tidbyt-community
description: The tidbyt/community "Analog Clock" app, ported to GDN — translated then hand-finished.
category: Time
entry: app.star
# tronbyt/Pixlet native size.
width: 64
height: 32
refresh: 60
pages: [main]
inputs:
  # schema.Location -> a US time zone (GDN's ctx.now is UTC). Daylight saving is
  # applied automatically, so this never needs changing twice a year.
  - key: zone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "ARIZONA", "PACIFIC", "ALASKA", "HAWAII"]